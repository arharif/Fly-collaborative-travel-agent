    <filter id="shadow"><feGaussianBlur stdDeviation="21"/></filter>
  </defs>
  <rect width="1200" height="420" rx="32" fill="url(#bg)"/>
  <circle cx="973" cy="207" r="168" fill="#E6F1E8" opacity=".8"/>
